name: Tarkov PvE Code Notifier

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得倉庫程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安裝依賴與 Chromium 瀏覽器
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: 4. 執行序號檢查腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node webhook_eftarkov.js

      - name: 5. 若有新序號則自動更新紀錄檔
        run: |
          if [ -f "eftarkov_pve_codes.json" ]; then
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git add eftarkov_pve_codes.json
            git diff --staged --quiet || (git commit -m "chore: update known PvE codes" && git push)
          fi
