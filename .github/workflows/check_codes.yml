name: Tarkov PvE Code Notifier

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-codes:
    runs-on: ubuntu-24.04  # 鎖定穩定版系統，消除警告並確保 Playwright 相容性
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'  # 配合最新 LTS 版本
      - run: npm install && npx playwright install chromium --with-deps
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node webhook_eftarkov.js
      - run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add eftarkov_pve_codes.json
          git diff --staged --quiet || (git commit -m "chore: update codes" && git push)
