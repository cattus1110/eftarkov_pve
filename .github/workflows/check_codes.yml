name: Tarkov PvE Code Notifier

on:
  schedule:
    # 每 15 分鐘自動執行一次 (UTC 時間)
    - cron: '*/15 * * * *'
  # 允許在 GitHub 網頁上手動點擊按鈕測試執行
  workflow_dispatch:

permissions:
  # 賦予寫入權限，讓機器人能把新序號紀錄存回倉庫
  contents: write

jobs:
  check-codes:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得倉庫程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 安裝依賴與 Chromium 瀏覽器
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: 4. 執行序號檢查腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node webhook_eftarkov.js

      - name: 5. 若有新序號則自動更新紀錄檔
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add eftarkov_pve_codes.json
          git diff --staged --quiet || (git commit -m "chore: update known PvE codes" && git push)
